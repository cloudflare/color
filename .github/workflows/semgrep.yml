on:
  pull_request: {}
  schedule:
    - cron: '0 0 * * 6'
concurrency:
  group: semgrep-${{ github.event_name }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  semgrep:
    name: semgrep-oss
    runs-on: ubuntu-slim
    container:
      image: semgrep/semgrep@sha256:500acf49f5e5785aa89af609b983f0427ac8cd08f7e34146277df6cffb002759 # v1.157.0
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - run: semgrep scan --config=auto
